<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirius Systems</title>
<meta name="description" content="Sirius Systems — launching soon.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  main {
    min-height: 100vh;
    box-sizing: border-box;
    padding: 48px 24px;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  img { display: block; width: clamp(260px, 52vw, 720px); height: auto; }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 260px; }
  .bar { position: relative; width: 100%; height: 2px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .bar span { position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: #fff; animation: sweep 1.8s ease-in-out infinite; }
  .label { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #9a9a9a; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; } }
</style>
</head>
<body>
<main>
  <img src="logo.jpg" alt="Sirius Systems">
  <div class="loader">
    <div class="bar" role="progressbar" aria-label="Loading"><span></span></div>
    <div class="label">Launching soon</div>
  </div>
</main>
</body>
</html>
